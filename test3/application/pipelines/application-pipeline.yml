trigger: none
  # branches:
  #   include:
  #     - main
  # paths:
  #   include:
  #     - application/*

pool:
  vmImage: 'windows-latest'

variables:
  resourceGroupName: 'sitecore-xp-prod-rg'
  storageAccountName: 'terrafmstorage01'
  storageContainerName: 'packages'
  deploymentId: 'sitecorexp102-uat'
  licenseFilePath: ''
  azureSubscription: 'Datacomcloudtf1'
  clientId: 'af6cec45-8e73-4ff1-9ca5-a2ba898f6d0b'
  tenantId: '9b137b97-8345-4a72-a060-5e083e8364c6'

steps:
- checkout: self
  fetchDepth: 0
  clean: true
  displayName: 'Checkout sitecore104 repository'

- task: AzurePowerShell@5
  displayName: 'Deploy CM'
  inputs:
    azurePowerShellVersion: 'LatestVersion'
    pwsh: true
    azureSubscription: '$(azureSubscription)'
    scriptType: 'FilePath'
    scriptPath: '$(System.DefaultWorkingDirectory)/application/deploy/deploy-sitecore.ps1'
    scriptArguments: >
      -ResourceGroupName "$(resourceGroupName)"
      -WebAppName "sitecorexp102-uat-cm"
      -StorageAccountName "$(storageAccountName)"
      -StorageContainerName "$(storageContainerName)"
      -DeploymentId "$(deploymentId)"
      -LicenseFilePath "$(licenseFilePath)"
      -WdpBlobName "Sitecore 10.4.0 rev. 010422 (Cloud)_cm.scwdp.zip"
      -ClientId "$(clientId)"
      -TenantId "$(tenantId)"
    errorActionPreference: 'Stop'
    verbosePreference: 'Continue'

- task: AzurePowerShell@5
  displayName: 'Deploy CD'
  inputs:
    azurePowerShellVersion: 'LatestVersion'
    pwsh: true
    azureSubscription: '$(azureSubscription)'
