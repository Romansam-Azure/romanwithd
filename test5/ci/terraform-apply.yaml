name: 'Terraform Apply - $(Date:yyMMdd)$(Rev:rr)'
trigger:
- none

pr:
  - '*'

variables:
  bkstrgrg: 'resourceforroma'
  bkstrg: 'terrafmstorage01'
  bkcontainer: 'azlzcon01'
  bkstrkey: 'devops.terraform.tfstate'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: ValidatePlan
    displayName: Validate the Terraform Plan
    jobs:
      - job: TerraformPlan
        displayName: Run Terraform Plan      
        steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.x'
            addToPath: true

        - task: TerraformTaskV4@4
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            commandOptions: '-reconfigure'
            backendServiceArm: 'Datacomcloudtf'
            backendAzureRmResourceGroupName: '$(bkstrgrg)'
            backendAzureRmStorageAccountName: '$(bkstrg)'
            backendAzureRmContainerName: '$(bkcontainer)'
            backendAzureRmKey: '$(bkstrkey)'