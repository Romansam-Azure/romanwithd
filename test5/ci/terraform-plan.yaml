trigger:
  branches:
    include:
      - main  # Replace with your target branch
  paths:
    include:
      - $(System.DefaultWorkingDirectory)/epson_lz/

pr:
- '*'
pool:
  vmImage: ubuntu-latest

steps:
- task: TerraformTaskV4@4
  displayName: init
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'Datacomcloudtf'
    backendAzureRmResourceGroupName: 'resourceforroma'
    backendAzureRmStorageAccountName: 'terrafmstorage01'
    backendAzureRmContainerName: 'azlzcon01'
    backendAzureRmKey: 'rootto.terraform.tfstate'

- bash: |
    terraform plan -input=false -var-file="variables.tfvars"
  displayName: Terraform Plan
  env:
    ARM_SUBSCRIPTION_ID: 
    ARM_CLIENT_ID: 
    ARM_CLIENT_SECRET: 
    ARM_TENANT_ID: 
